services:
  autobughunter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openhands-bughunter
    restart: unless-stopped
    ports:
      # Bind to loopback interface on host to prevent unintended public internet exposure
      - "127.0.0.1:8080:8080"
    volumes:
      - ./workspace/state:/workspace/state
      - ./workspace/repos:/workspace/repos
    env_file:
      - .env
    environment:
      - WORKSPACE_DIR=/workspace
      - STATE_DIR=/workspace/state
      - REPOS_DIR=/workspace/repos
      - DB_PATH=/workspace/state/bughunter.sqlite
      - LOG_FILE_PATH=/workspace/state/bughunter.log
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8080
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY:-}
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: 20G
